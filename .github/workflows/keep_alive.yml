name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -L --max-redirs 5 --max-time 30 -o /dev/null -w "HTTP status: %{http_code}\n" https://skillscavenge.streamlit.app/
